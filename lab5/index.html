<!DOCTYPE html>
<!--else is the default that happens if the "if" and "else if" conditions are not met because it is the last one-->
<html>
    <head>
        <title>Bank Account</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="bank-account">
            <h2>Account Status</h2>

            <p>Cash: <span id="account-display">100</span></p>
            <p id="status-message">Let's be financially responsible!</p>

            <button onclick="addCash()">Add $50</button>
            <button onclick="subtractCash()">Subtract $50</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
