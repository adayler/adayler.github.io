<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of South Carolina Football Gameday Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>University of South Carolina Football Gameday Essentials</h1>
        <p>Everything you need for a Saturday in Williams-Brice Stadium and Cocky's Cockaboose!</p>
    </header>

    <main>
        <section>
            <h2>The Gamecock Gameday Checklist</h2>
            
            <!-- Form to add new items -->
            <form id="item-form">
                <input type="text" id="item-input" placeholder="Add custom gameday item..." required>
                <button type="submit">Add Item</button>
            </form>

            <!-- Populated dynamically via JS -->
            <ul id="checklist"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 University of South Carolina Gameday Fan Page. Forever to Thee!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
