<!DOCTYPE html>

<html lang="en">

<head>
    <title>Table Example Day 4</title>
</head>

<body>

        <table border="1">
            <!--The header cells are bold-->
            <thead>
                <tr>
                    <th>Cell 1</th>
                    <th>Cell 2</th>
                    <th>Cell 3</th>
                </tr>
            </thead>
            <tbody>
                <tr> <!--td, see below, is used for body and footer-->
                    <td>Data 1</td>
                    <td>Data 2</td>
                    <td>Data 3</td>
                </tr>
            </tbody>
            <tfoot>
                <tr> <!--colspan = creates one long cell row -->
                    <td colspan="3">Foot 1</td>
                </tr>
            </tfoot>


        </table>
</body>

</html>
